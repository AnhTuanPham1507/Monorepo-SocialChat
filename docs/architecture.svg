<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub   { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; fill: #64748b; font-style: italic; }
      .group { font-size: 13px; font-weight: 600; fill: #4338ca; letter-spacing: .3px; }
      .line  { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1120" height="680" fill="#ffffff"/>

  <!-- Client -->
  <rect x="445" y="20" width="230" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="44" text-anchor="middle" class="title">Web / Mobile Client</text>
  <text x="560" y="62" text-anchor="middle" class="sub">REST · WebSocket</text>

  <line x1="560" y1="74" x2="560" y2="108" class="line" marker-end="url(#arrow)"/>

  <!-- Kong -->
  <rect x="385" y="110" width="350" height="54" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="560" y="134" text-anchor="middle" class="title">Kong API Gateway</text>
  <text x="560" y="152" text-anchor="middle" class="sub">routing · CORS · rate limiting</text>

  <line x1="560" y1="164" x2="560" y2="198" class="line" marker-end="url(#arrow)"/>

  <!-- Services container -->
  <rect x="40" y="200" width="1000" height="150" rx="14" fill="#f5f7ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="224" class="group">NESTJS MICROSERVICES · DDD · HEXAGONAL ARCHITECTURE</text>

  <g>
    <rect x="56"  y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="130" y="278" text-anchor="middle" class="title">auth</text>
    <text x="130" y="298" text-anchor="middle" class="sub">login · JWT tokens</text>

    <rect x="220" y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="294" y="278" text-anchor="middle" class="title">user</text>
    <text x="294" y="298" text-anchor="middle" class="sub">profiles · friends</text>

    <rect x="384" y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="458" y="278" text-anchor="middle" class="title">asset</text>
    <text x="458" y="298" text-anchor="middle" class="sub">uploads · media</text>

    <rect x="548" y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="622" y="278" text-anchor="middle" class="title">feed</text>
    <text x="622" y="298" text-anchor="middle" class="sub">posts · feed · search</text>

    <rect x="712" y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="786" y="278" text-anchor="middle" class="title">messaging</text>
    <text x="786" y="298" text-anchor="middle" class="sub">chats · receipts</text>

    <rect x="876" y="240" width="148" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="950" y="278" text-anchor="middle" class="title">realtime-gateway</text>
    <text x="950" y="298" text-anchor="middle" class="sub">Socket.IO · presence</text>
  </g>

  <!-- Services -> data layer -->
  <line x1="560" y1="350" x2="560" y2="388" class="line" marker-end="url(#arrow)"/>

  <!-- Data layer container -->
  <rect x="40" y="390" width="1000" height="118" rx="14" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Data stores -->
  <rect x="56" y="425" width="148" height="70" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="130" y="455" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="130" y="475" text-anchor="middle" class="sub">write model</text>

  <rect x="220" y="425" width="148" height="70" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="294" y="455" text-anchor="middle" class="title">MongoDB</text>
  <text x="294" y="475" text-anchor="middle" class="sub">read models · messages</text>

  <rect x="384" y="425" width="148" height="70" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="458" y="455" text-anchor="middle" class="title">OpenSearch</text>
  <text x="458" y="475" text-anchor="middle" class="sub">full-text search</text>

  <rect x="548" y="425" width="148" height="70" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="622" y="455" text-anchor="middle" class="title">Redis</text>
  <text x="622" y="475" text-anchor="middle" class="sub">presence · pub/sub</text>

  <rect x="712" y="425" width="148" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="786" y="455" text-anchor="middle" class="title">Keycloak</text>
  <text x="786" y="475" text-anchor="middle" class="sub">identity (OIDC)</text>

  <rect x="876" y="425" width="148" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="950" y="455" text-anchor="middle" class="title">Cloudflare R2</text>
  <text x="950" y="475" text-anchor="middle" class="sub">media storage</text>

  <!-- CDC: Postgres -> Debezium -> Kafka -->
  <line x1="130" y1="495" x2="130" y2="568" class="line" marker-end="url(#arrow)"/>
  <text x="140" y="534" class="label">WAL changes</text>

  <rect x="56" y="570" width="230" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="171" y="597" text-anchor="middle" class="title">Debezium</text>
  <text x="171" y="616" text-anchor="middle" class="sub">change data capture</text>

  <line x1="286" y1="602" x2="358" y2="602" class="line" marker-end="url(#arrow)"/>

  <rect x="360" y="570" width="500" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="610" y="597" text-anchor="middle" class="title">Apache Kafka</text>
  <text x="610" y="616" text-anchor="middle" class="sub">CDC topics · chat commands · integration events · DLQ</text>

  <!-- Kafka <-> services -->
  <path d="M860,602 L1075,602 L1075,275 L1042,275" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1090" y="440" class="label" transform="rotate(90 1090 440)" text-anchor="middle">publish / consume</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
